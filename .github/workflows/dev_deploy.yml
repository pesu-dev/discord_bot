name: Dev Deploy

on:
  workflow_run:
    workflows:
      - CI Checks
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  SHA_TAG: ${{ github.event.workflow_run.head_sha }}
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: dev_deploy
  cancel-in-progress: false

jobs:
  build_and_push_image:
    name: Build and push commit image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev'
    uses: ./.github/workflows/build_and_push_image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      image_tag: ${{ github.event.workflow_run.head_sha }}
      push: true

  sync_guild_commands:
    name: Sync guild commands (dev)
    needs: [build_and_push_image]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve previously deployed dev SHA
        id: previous
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          if docker pull "${IMAGE}:dev" >/dev/null 2>&1; then
            BASE_SHA="$(docker inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE}:dev")"
            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "unknown" ]; then
              echo "No usable revision label on :dev image; command sync will run unconditionally."
              echo "base_ref=" >> "$GITHUB_OUTPUT"
            else
              echo "base_ref=${BASE_SHA}" >> "$GITHUB_OUTPUT"
              echo "Previously deployed dev SHA: ${BASE_SHA}"
            fi
          else
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            echo "No existing dev image tag; command sync will run unconditionally."
          fi

      - name: Sync guild commands if registry changed
        uses: ./.github/actions/sync-guild-commands
        with:
          head_ref: ${{ github.event.workflow_run.head_sha }}
          base_ref: ${{ steps.previous.outputs.base_ref }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          app_env: dev

  deploy_dev:
    name: Deploy commit image to dev
    needs: [build_and_push_image, sync_guild_commands]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Trigger VM deploy gate (dev)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ secrets.VM_FINGERPRINT }}
          script: dev ${{ env.SHA_TAG }}

  tag_dev:
    name: Tag deployed commit image as dev
    needs: [deploy_dev]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag commit image as dev
        run: |
          docker pull "${IMAGE}:${SHA_TAG}"
          docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:dev"
          docker push "${IMAGE}:dev"

  cleanup_ghcr:
    name: Cleanup old package versions in GHCR
    needs: [tag_dev]
    uses: ./.github/workflows/ghcr_cleanup.yml
    with:
      keep_sha_tags: 20
