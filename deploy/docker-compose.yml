services:
  discord_bot:
    image: ghcr.io/${REPO_OWNER:-pesu-dev}/${DOCKER_IMAGE_NAME:-discord_bot}:${IMAGE_TAG:-dev}
    container_name: discord_bot_${TARGET_ENV:-local}
    restart: always
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${TARGET_ENV:-local}
      MONGO_X509_CERT_PATH: /run/secrets/mongo.pem
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      - /srv/discord_bot/certs/mongo-${TARGET_ENV}.pem:/run/secrets/mongo.pem:ro
      - /srv/discord_bot/certs/github-app.pem:/run/secrets/github-app.pem:ro