[project]
name = "pesu_discord_bot"
version = "0.1.0"
description = "Community management Discord Bot for PESU Discord server"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Sachin Balasubramanyam", email = "sachinshankar1206@gmail.com" },
]
license = "MIT"
license-files = [
    "LICENSE"
]
dependencies = [
    "discord-py==2.7.1",
    "httpx==0.28.1",
    "pymongo==4.17.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "ruff>=0.15.0",
    "testcontainers>=4.0",
]

[project.urls]
Homepage = "https://github.com/pesu-dev/discord_bot"
Repository = "https://github.com/pesu-dev/discord_bot"
Issues = "https://github.com/pesu-dev/discord_bot/issues"
"Project Board" = "https://github.com/orgs/pesu-dev/projects/4/"

[tool.uv]
required-version = ">=0.11.0,<0.12"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # Complexity rules
    "ANN",  # Annotations rules
    "TYP",  # Type checking rules
    "Q000", # Quotation style rules
    "RET",  # Return type rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "TC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast isolated tests",
    "integration: needs Docker/Testcontainers",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/__main__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true
